[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[project]
name = "legion"
version = "0.1.0"
description = "Swarm robotics with Cyberbricks, orchestrated by Claude Code"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [
    { name = "Sankalp Sanand", email = "sanandsankalp@gmail.com" },
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiomqtt>=2.3",
    "typer>=0.15",
    "opencv-contrib-python>=4.10",
    "av>=14",
    "mlx-qwen3-asr>=0.1",
    "claude-agent-sdk>=0.1.48",
    "coremltools>=8",
    "lapx>=0.5",
    "omegaconf",
    "einops",
    "addict",
    "kornia",
    "e3nn",
    "moviepy==1.0.3",
    "pillow-heif",
    "awesome-depth-anything-3",
    "onnxruntime>=1.24.4",
    "supervision>=0.25",
]

[project.urls]
Homepage = "https://github.com/kessler-frost/legion"
Repository = "https://github.com/kessler-frost/legion"
Issues = "https://github.com/kessler-frost/legion/issues"

[project.scripts]
legion = "brain.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]
