[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[project]
name = "legion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiomqtt>=2.3",
    "typer>=0.15",
    "opencv-contrib-python>=4.10",
    "onnxruntime>=8.3",
    "av>=14",
    "mlx-qwen3-asr>=0.1",
]

[project.scripts]
legion = "brain.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]
