<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion — Recordings</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #111113;
            --surface-raised: #19191d;
            --border: #2a2a30;
            --text: #e8e6e3;
            --text-dim: #6b6a6f;
            --accent: #c4a35a;
            --danger: #c25450;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Familjen Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #ffffff06 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .wordmark {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        a.back {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-dim);
            text-decoration: none;
            letter-spacing: 0.1em;
        }
        a.back:hover { color: var(--accent); }
        .btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn:hover { border-color: var(--accent); color: var(--text); }
        .btn.danger { border-color: var(--danger); color: var(--danger); }
        .btn.danger:hover { background: var(--danger); color: var(--bg); }
        .btn.active { border-color: var(--accent); color: var(--accent); }

        .content {
            display: flex;
            gap: 2rem;
            max-width: 1200px;
        }

        /* Player */
        .player-section {
            flex: 1;
            min-width: 0;
        }
        .player-section video {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: #000;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }
        .speed-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-right: 0.25rem;
        }
        .now-playing {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent);
            margin-top: 0.5rem;
        }

        /* List */
        .list-section {
            width: 360px;
            min-width: 360px;
        }
        .list-actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .recordings {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .rec-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface);
            transition: border-color 0.15s;
            cursor: pointer;
        }
        .rec-item:hover { border-color: var(--accent); }
        .rec-item.selected { border-color: var(--accent); background: var(--surface-raised); }
        .rec-item.playing { border-color: var(--accent); }
        .rec-item input[type="checkbox"] {
            accent-color: var(--accent);
            cursor: pointer;
        }
        .rec-info { flex: 1; min-width: 0; }
        .rec-name {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rec-meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.55rem;
            color: var(--text-dim);
            margin-top: 0.2rem;
        }
        .rec-actions {
            display: flex;
            gap: 0.25rem;
        }
        .empty {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="wordmark">Recordings</div>
        <a class="back" href="/">← home</a>
    </div>

    <div class="content">
        <div class="player-section">
            <video id="video" controls></video>
            <div class="player-controls">
                <span class="speed-label">speed:</span>
                <button class="btn" onclick="setSpeed(0.5)">0.5x</button>
                <button class="btn active" onclick="setSpeed(1)">1x</button>
                <button class="btn" onclick="setSpeed(1.5)">1.5x</button>
                <button class="btn" onclick="setSpeed(2)">2x</button>
                <button class="btn" onclick="setSpeed(4)">4x</button>
            </div>
            <div class="now-playing" id="now-playing"></div>
        </div>

        <div class="list-section">
            <div class="list-actions">
                <button class="btn" onclick="selectAll()">all</button>
                <button class="btn" onclick="selectNone()">none</button>
                <button class="btn danger" onclick="deleteSelected()">delete</button>
            </div>
            <div class="recordings" id="list"></div>
        </div>
    </div>

    <script>
        const videoEl = document.getElementById("video");
        const listEl = document.getElementById("list");
        const nowPlaying = document.getElementById("now-playing");
        let currentFile = null;

        function setSpeed(s) {
            videoEl.playbackRate = s;
            document.querySelectorAll(".player-controls .btn").forEach(b => b.classList.remove("active"));
            event.target.classList.add("active");
        }

        async function loadRecordings() {
            const recs = await fetch("/recording/list").then(r => r.json());
            listEl.innerHTML = "";

            if (recs.length === 0) {
                listEl.innerHTML = '<div class="empty">no recordings yet</div>';
                return;
            }

            recs.forEach(rec => {
                const div = document.createElement("div");
                div.className = "rec-item";

                const date = new Date(rec.created * 1000);
                const dateStr = date.toLocaleString();

                div.innerHTML = `
                    <input type="checkbox" data-file="${rec.filename}" onclick="event.stopPropagation()">
                    <div class="rec-info" onclick="playRecording('${rec.filename}')">
                        <div class="rec-name">${rec.filename}</div>
                        <div class="rec-meta">${rec.size_mb} MB · ${dateStr}</div>
                    </div>
                    <div class="rec-actions">
                        <button class="btn" onclick="event.stopPropagation(); createSpeedup('${rec.filename}', 2)" title="Create 2x version">2x</button>
                    </div>
                `;

                const cb = div.querySelector("input");
                cb.addEventListener("change", () => div.classList.toggle("selected", cb.checked));

                listEl.appendChild(div);
            });
        }

        function playRecording(filename) {
            document.querySelectorAll(".rec-item").forEach(r => r.classList.remove("playing"));
            event?.target?.closest?.(".rec-item")?.classList?.add("playing");
            videoEl.src = `/rec/${filename}`;
            videoEl.play();
            currentFile = filename;
            nowPlaying.textContent = filename;
        }

        async function createSpeedup(filename, speed) {
            const btn = event.target;
            btn.textContent = "...";
            btn.disabled = true;
            await fetch("/recording/speedup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ filename, speed }),
            });
            btn.textContent = "2x";
            btn.disabled = false;
            loadRecordings();
        }

        function selectAll() {
            document.querySelectorAll('.rec-item input').forEach(cb => {
                cb.checked = true;
                cb.closest('.rec-item').classList.add('selected');
            });
        }

        function selectNone() {
            document.querySelectorAll('.rec-item input').forEach(cb => {
                cb.checked = false;
                cb.closest('.rec-item').classList.remove('selected');
            });
        }

        async function deleteSelected() {
            const filenames = [...document.querySelectorAll('.rec-item input:checked')]
                .map(cb => cb.dataset.file);
            if (filenames.length === 0) return;
            await fetch("/recording/delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ filenames }),
            });
            if (filenames.includes(currentFile)) {
                videoEl.pause();
                videoEl.src = "";
                nowPlaying.textContent = "";
            }
            loadRecordings();
        }

        loadRecordings();
    </script>
</body>
</html>
