<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion — Recordings</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #111113;
            --border: #2a2a30;
            --text: #e8e6e3;
            --text-dim: #6b6a6f;
            --accent: #c4a35a;
            --danger: #c25450;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Familjen Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #ffffff06 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .wordmark {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        a.back {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-dim);
            text-decoration: none;
            letter-spacing: 0.1em;
        }
        a.back:hover { color: var(--accent); }
        .actions {
            margin-bottom: 1rem;
        }
        .btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s ease;
            margin-right: 0.5rem;
        }
        .btn:hover { border-color: var(--accent); color: var(--text); }
        .btn.danger { border-color: var(--danger); color: var(--danger); }
        .btn.danger:hover { background: var(--danger); color: var(--bg); }
        .recordings {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 800px;
        }
        .rec-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface);
            transition: border-color 0.15s;
        }
        .rec-item:hover { border-color: var(--accent); }
        .rec-item.selected { border-color: var(--accent); background: #19191d; }
        .rec-item input[type="checkbox"] {
            accent-color: var(--accent);
            cursor: pointer;
        }
        .rec-name {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: var(--text);
            flex: 1;
            cursor: pointer;
        }
        .rec-meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-dim);
        }
        .player {
            margin-bottom: 2rem;
            max-width: 800px;
        }
        .player video {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 3px;
        }
        .empty {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="wordmark">Recordings</div>
        <a class="back" href="/">← home</a>
    </div>

    <div class="player" id="player" style="display:none">
        <video id="video" controls></video>
    </div>

    <div class="actions" id="actions" style="display:none">
        <button class="btn" onclick="selectAll()">select all</button>
        <button class="btn" onclick="selectNone()">select none</button>
        <button class="btn danger" onclick="deleteSelected()">delete selected</button>
    </div>

    <div class="recordings" id="list"></div>

    <script>
        const listEl = document.getElementById("list");
        const playerEl = document.getElementById("player");
        const videoEl = document.getElementById("video");
        const actionsEl = document.getElementById("actions");

        async function loadRecordings() {
            const recs = await fetch("/recording/list").then(r => r.json());
            listEl.innerHTML = "";

            if (recs.length === 0) {
                listEl.innerHTML = '<div class="empty">no recordings yet</div>';
                actionsEl.style.display = "none";
                return;
            }

            actionsEl.style.display = "block";

            recs.forEach(rec => {
                const div = document.createElement("div");
                div.className = "rec-item";
                div.dataset.filename = rec.filename;

                const date = new Date(rec.created * 1000);
                const dateStr = date.toLocaleString();

                div.innerHTML = `
                    <input type="checkbox" data-file="${rec.filename}">
                    <div class="rec-name" onclick="playRecording('${rec.filename}')">${rec.filename}</div>
                    <div class="rec-meta">${rec.size_mb} MB · ${dateStr}</div>
                `;

                const cb = div.querySelector("input");
                cb.addEventListener("change", () => {
                    div.classList.toggle("selected", cb.checked);
                });

                listEl.appendChild(div);
            });
        }

        function playRecording(filename) {
            videoEl.src = `/rec/${filename}`;
            playerEl.style.display = "block";
            videoEl.play();
        }

        function selectAll() {
            document.querySelectorAll('.rec-item input').forEach(cb => {
                cb.checked = true;
                cb.closest('.rec-item').classList.add('selected');
            });
        }

        function selectNone() {
            document.querySelectorAll('.rec-item input').forEach(cb => {
                cb.checked = false;
                cb.closest('.rec-item').classList.remove('selected');
            });
        }

        async function deleteSelected() {
            const filenames = [...document.querySelectorAll('.rec-item input:checked')]
                .map(cb => cb.dataset.file);
            if (filenames.length === 0) return;
            await fetch("/recording/delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ filenames }),
            });
            videoEl.pause();
            playerEl.style.display = "none";
            loadRecordings();
        }

        loadRecordings();
    </script>
</body>
</html>
