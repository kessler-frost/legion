<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Legion — Control</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #111113;
            --surface-raised: #19191d;
            --border: #2a2a30;
            --text: #e8e6e3;
            --text-dim: #6b6a6f;
            --accent: #c4a35a;
            --accent-glow: #c4a35a22;
            --danger: #c25450;
            --success: #5a9a6a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Familjen Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3rem;
            overflow: hidden;
            position: relative;
        }

        /* subtle dot grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #ffffff06 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        /* header */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .wordmark {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .status {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            padding: 0.35rem 1rem;
            border-radius: 2px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            transition: all 0.4s ease;
        }

        .status.ok {
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 12px #5a9a6a15;
        }

        /* joystick area */
        .joystick-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joystick-base {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            position: relative;
            touch-action: none;
            cursor: grab;
            box-shadow: inset 0 2px 20px #00000040;
        }

        .joystick-base::after {
            content: '';
            position: absolute;
            inset: 50%;
            width: 2px;
            height: 2px;
            background: var(--border);
            border-radius: 50%;
            box-shadow:
                0 -40px 0 var(--border),
                0 40px 0 var(--border),
                -40px 0 0 var(--border),
                40px 0 0 var(--border);
            transform: translate(-50%, -50%);
        }

        .joystick-knob {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: box-shadow 0.15s ease;
            pointer-events: none;
            box-shadow: 0 2px 8px #00000060;
        }

        .joystick-knob.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow), 0 2px 8px #00000060;
        }

        .joystick-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 300;
            color: var(--text-dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            position: absolute;
            pointer-events: none;
        }

        .joystick-label.top    { top: -24px; left: 50%; transform: translateX(-50%); }
        .joystick-label.bottom { bottom: -24px; left: 50%; transform: translateX(-50%); }
        .joystick-label.left   { left: -36px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
        .joystick-label.right  { right: -36px; top: 50%; transform: translateY(-50%) rotate(90deg); }

        /* telemetry readout */
        .readout {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            font-weight: 300;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            display: flex;
            gap: 2rem;
        }

        .readout span {
            color: var(--accent);
        }

        /* action buttons */
        .actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.8rem 2rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .btn:active, .btn.active {
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .btn.stop {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn.stop:hover {
            background: #c2545033;
            color: var(--text);
        }
        .btn.stop:active, .btn.stop.active {
            background: var(--danger);
            color: var(--bg);
            box-shadow: 0 0 16px #c2545022;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="wordmark">Legion</div>
        <div class="status" id="status">connecting</div>
    </div>

    <div class="joystick-container">
        <span class="joystick-label top">fwd</span>
        <span class="joystick-label bottom">rev</span>
        <span class="joystick-label left">left</span>
        <span class="joystick-label right">right</span>
        <div class="joystick-base" id="joystick-base">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
    </div>

    <div class="readout">
        <div>dir <span id="r-dir">---</span></div>
        <div>spd <span id="r-spd">0</span></div>
    </div>

    <div class="actions">
        <button class="btn stop" id="btn-stop">stop</button>
        <button class="btn" id="btn-kick">kick</button>
    </div>

    <script>
        const BOT_ID = 1;
        const MAX_SPEED = 2048;
        const DEADZONE = 0.15;
        const SEND_INTERVAL = 80;

        let lastLeft = 0;
        let lastRight = 0;
        let sendTimer = null;

        async function sendCommand(action, params = {}) {
            fetch(`/bot/${BOT_ID}/command`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action, params }),
            });
        }

        // --- Joystick ---
        const base = document.getElementById("joystick-base");
        const knob = document.getElementById("joystick-knob");
        const rDir = document.getElementById("r-dir");
        const rSpd = document.getElementById("r-spd");
        let dragging = false;
        let baseRect = null;

        function getJoystickValues(clientX, clientY) {
            const cx = baseRect.left + baseRect.width / 2;
            const cy = baseRect.top + baseRect.height / 2;
            const radius = baseRect.width / 2;

            let dx = (clientX - cx) / radius;
            let dy = (clientY - cy) / radius;

            const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 1);
            const angle = Math.atan2(dy, dx);
            dx = Math.cos(angle) * dist;
            dy = Math.sin(angle) * dist;

            return { dx, dy, dist };
        }

        function updateKnob(dx, dy) {
            const radius = baseRect.width / 2;
            const px = dx * radius;
            const py = dy * radius;
            knob.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
        }

        function joystickToMotors(dx, dy, dist) {
            if (dist < DEADZONE) return { left: 0, right: 0 };

            const scale = (dist - DEADZONE) / (1 - DEADZONE);
            const throttle = -dy * scale * MAX_SPEED;
            const steering = dx * scale * MAX_SPEED;

            let left = Math.round(throttle + steering);
            let right = Math.round(throttle - steering);

            left = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, left));
            right = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, right));

            return { left, right };
        }

        function handleJoystickMove(clientX, clientY) {
            const { dx, dy, dist } = getJoystickValues(clientX, clientY);
            updateKnob(dx, dy);

            const { left, right } = joystickToMotors(dx, dy, dist);

            rDir.textContent = left === 0 && right === 0 ? "---" : `${left}/${right}`;
            rSpd.textContent = Math.round((Math.abs(left) + Math.abs(right)) / 2);

            if (Math.abs(left - lastLeft) > 50 || Math.abs(right - lastRight) > 50) {
                lastLeft = left;
                lastRight = right;
                if (left === 0 && right === 0) {
                    sendCommand("stop");
                } else {
                    sendCommand("drive", { left, right });
                }
            }
        }

        function resetJoystick() {
            knob.style.transform = "translate(-50%, -50%)";
            knob.classList.remove("active");
            rDir.textContent = "---";
            rSpd.textContent = "0";

            if (lastLeft !== 0 || lastRight !== 0) {
                lastLeft = 0;
                lastRight = 0;
                sendCommand("stop");
            }

            if (sendTimer) {
                clearInterval(sendTimer);
                sendTimer = null;
            }
        }

        base.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            base.setPointerCapture(e.pointerId);
            dragging = true;
            baseRect = base.getBoundingClientRect();
            knob.classList.add("active");
            handleJoystickMove(e.clientX, e.clientY);

            sendTimer = setInterval(() => {
                if (lastLeft !== 0 || lastRight !== 0) {
                    sendCommand("drive", { left: lastLeft, right: lastRight });
                }
            }, SEND_INTERVAL);
        });

        base.addEventListener("pointermove", (e) => {
            if (!dragging) return;
            e.preventDefault();
            handleJoystickMove(e.clientX, e.clientY);
        });

        base.addEventListener("pointerup", (e) => {
            dragging = false;
            resetJoystick();
        });

        base.addEventListener("pointercancel", (e) => {
            dragging = false;
            resetJoystick();
        });

        // --- Stop button ---
        const stopBtn = document.getElementById("btn-stop");
        stopBtn.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            stopBtn.classList.add("active");
            sendCommand("stop");
            resetJoystick();
        });
        stopBtn.addEventListener("pointerup", () => stopBtn.classList.remove("active"));

        // --- Kick button ---
        const kickBtn = document.getElementById("btn-kick");
        kickBtn.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            kickBtn.classList.add("active");
            sendCommand("kick");
        });
        kickBtn.addEventListener("pointerup", (e) => {
            e.preventDefault();
            kickBtn.classList.remove("active");
            sendCommand("kick_stop");
        });
        kickBtn.addEventListener("pointerleave", (e) => {
            e.preventDefault();
            kickBtn.classList.remove("active");
            sendCommand("kick_stop");
        });

        // --- Status ---
        async function checkStatus() {
            const el = document.getElementById("status");
            const res = await fetch(`/bot/${BOT_ID}/status`).catch(() => null);
            if (res && res.ok) {
                const data = await res.json();
                el.textContent = data.connected ? "connected" : "waiting";
                el.className = "status" + (data.connected ? " ok" : "");
            } else {
                el.textContent = "offline";
                el.className = "status";
            }
        }
        checkStatus();
        setInterval(checkStatus, 3000);
    </script>
</body>
</html>
