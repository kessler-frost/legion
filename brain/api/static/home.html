<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #111113;
            --border: #2a2a30;
            --text: #e8e6e3;
            --text-dim: #6b6a6f;
            --accent: #c4a35a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Familjen Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3rem;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #ffffff06 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }
        .wordmark {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .nav {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 280px;
        }
        .nav a {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 1rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--surface);
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.15s ease;
        }
        .nav a:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .nav a .arrow {
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .nav a:hover .arrow { opacity: 1; }
        .nav a .desc {
            display: block;
            font-size: 0.6rem;
            font-weight: 300;
            color: var(--text-dim);
            margin-top: 0.3rem;
            text-transform: none;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="wordmark">Legion</div>
    <nav class="nav">
        <a href="/control">
            <div>
                Control
                <span class="desc">Joystick + bot commands</span>
            </div>
            <span class="arrow">&rarr;</span>
        </a>
        <a href="/stream">
            <div>
                Stream
                <span class="desc">Live camera + YOLO detection</span>
            </div>
            <span class="arrow">&rarr;</span>
        </a>
        <a href="/docs">
            <div>
                API
                <span class="desc">FastAPI auto-generated docs</span>
            </div>
            <span class="arrow">&rarr;</span>
        </a>
    </nav>
</body>
</html>
