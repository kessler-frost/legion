<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion — Command Center</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #111113;
            --surface-raised: #19191d;
            --border: #2a2a30;
            --text: #e8e6e3;
            --text-dim: #6b6a6f;
            --accent: #c4a35a;
            --accent-glow: #c4a35a22;
            --danger: #c25450;
            --success: #5a9a6a;
            --blue: #4a8cc7;
            --purple: #8a6cc7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Familjen Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #ffffff06 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }
        .wordmark {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-right: auto;
        }
        .hbtn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.35rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .hbtn:hover { border-color: var(--accent); color: var(--text); }
        .hbtn.active { border-color: var(--accent); color: var(--accent); }

        /* Main layout */
        .main {
            display: flex;
            flex: 1;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* Video panel */
        .video-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            position: relative;
            min-width: 0;
        }
        .video-panel img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .no-feed {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
        }

        /* Chat panel */
        .chat-panel {
            width: 420px;
            min-width: 420px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
            background: var(--bg);
            height: calc(100vh - 49px);
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .msg {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            line-height: 1.5;
            padding: 0.5rem 0.75rem;
            border-radius: 3px;
            word-break: break-word;
        }
        .msg.status { color: var(--text-dim); font-style: italic; }
        .msg.user { background: var(--surface-raised); color: var(--accent); }
        .msg.user::before { content: '> '; opacity: 0.5; }
        .msg.transcription { background: var(--surface-raised); color: var(--purple); }
        .msg.transcription::before { content: '🎙 '; }
        .msg.assistant { color: var(--text); }
        .msg.tool_use {
            background: var(--surface);
            border-left: 2px solid var(--blue);
            color: var(--text-dim);
        }
        .msg.tool_use::before { content: '⚡ '; }
        .msg.tool_result {
            background: var(--surface);
            border-left: 2px solid var(--success);
            color: var(--text-dim);
            max-height: 120px;
            overflow-y: auto;
        }
        .msg.error { color: var(--danger); }
        .msg.error::before { content: '✗ '; }

        /* Input area */
        .input-area {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
        }
        .input-area input {
            flex: 1;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--surface);
            color: var(--text);
            outline: none;
        }
        .input-area input:focus { border-color: var(--accent); }
        .input-area input::placeholder { color: var(--text-dim); }

        .send-btn, .mic-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .send-btn:hover { border-color: var(--accent); color: var(--text); }
        .mic-btn:hover { border-color: var(--danger); color: var(--text); }
        .mic-btn.recording {
            border-color: var(--danger);
            color: var(--danger);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="wordmark">Legion</div>
        <button class="hbtn" id="btn-capture" onclick="toggleCapture()">start capture</button>
        <button class="hbtn" id="btn-raw" onclick="switchStream(false)">raw</button>
        <button class="hbtn" id="btn-yolo" onclick="switchStream(true)">yolo</button>
    </div>

    <div class="main">
        <div class="video-panel">
            <img id="stream" style="display:none" alt="stream">
            <div class="no-feed" id="no-feed">no feed — click start capture</div>
        </div>

        <div class="chat-panel">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="cmd-input" placeholder="type a command..." autocomplete="off">
                <button class="send-btn" onclick="sendText()">send</button>
                <button class="mic-btn" id="mic-btn" onclick="toggleMic()">mic</button>
                <button class="mic-btn" id="auto-btn" onclick="toggleAutoListen()">auto</button>
            </div>
        </div>
    </div>

    <script>
        const img = document.getElementById("stream");
        const noFeed = document.getElementById("no-feed");
        const messagesEl = document.getElementById("messages");
        const cmdInput = document.getElementById("cmd-input");
        const micBtn = document.getElementById("mic-btn");
        const captureBtn = document.getElementById("btn-capture");

        // --- Video stream ---
        let streamWs = null;
        let capturing = false;
        let showAnnotated = false;

        function connectStream() {
            if (streamWs) streamWs.close();
            const param = showAnnotated ? "?annotated=true" : "";
            streamWs = new WebSocket(`ws://${location.host}/ws/stream${param}`);
            streamWs.binaryType = "blob";
            streamWs.onmessage = (e) => {
                const url = URL.createObjectURL(e.data);
                img.onload = () => URL.revokeObjectURL(url);
                img.src = url;
                img.style.display = "block";
                noFeed.style.display = "none";
            };
        }

        async function toggleCapture() {
            if (capturing) {
                await fetch("/vision/stop", { method: "POST" });
                capturing = false;
                captureBtn.textContent = "start capture";
                captureBtn.classList.remove("active");
                if (streamWs) streamWs.close();
                img.style.display = "none";
                noFeed.style.display = "block";
            } else {
                await fetch("/vision/start", { method: "POST" });
                capturing = true;
                captureBtn.textContent = "stop capture";
                captureBtn.classList.add("active");
                setTimeout(() => connectStream(), 1000);
            }
        }

        function switchStream(annotated) {
            showAnnotated = annotated;
            document.getElementById("btn-raw").className = "hbtn" + (annotated ? "" : " active");
            document.getElementById("btn-yolo").className = "hbtn" + (annotated ? " active" : "");
            if (capturing) connectStream();
        }

        // Check if vision is already running
        fetch("/vision/status").then(r => r.json()).then(data => {
            if (data.running) {
                capturing = true;
                captureBtn.textContent = "stop capture";
                captureBtn.classList.add("active");
                connectStream();
            }
        });

        // --- Brain WebSocket ---
        let brainWs = null;

        function connectBrain() {
            brainWs = new WebSocket(`ws://${location.host}/ws/brain`);
            brainWs.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                addMessage(msg);
            };
            brainWs.onclose = () => setTimeout(connectBrain, 2000);
        }

        function addMessage(msg) {
            const div = document.createElement("div");
            div.className = "msg " + msg.type;

            switch (msg.type) {
                case "status":
                    div.textContent = msg.text;
                    break;
                case "user":
                    div.textContent = msg.text;
                    break;
                case "transcription":
                    div.textContent = msg.text;
                    break;
                case "assistant":
                    div.textContent = msg.text;
                    break;
                case "tool_use":
                    div.textContent = `${msg.tool}: ${msg.input}`;
                    break;
                case "tool_result":
                    div.textContent = msg.text;
                    break;
                case "error":
                    div.textContent = msg.text;
                    break;
            }

            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        connectBrain();

        // --- Text input ---
        async function sendText() {
            const text = cmdInput.value.trim();
            if (!text) return;
            cmdInput.value = "";
            await fetch("/brain/send", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text }),
            });
        }

        cmdInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendText();
        });

        // --- Mic (manual) ---
        let mediaRecorder = null;
        let recording = false;
        let audioChunks = [];

        async function toggleMic() {
            if (recording) {
                mediaRecorder.stop();
                recording = false;
                micBtn.textContent = "mic";
                micBtn.classList.remove("recording");
            } else {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: "audio/wav" });
                    const form = new FormData();
                    form.append("audio", blob, "recording.wav");
                    await fetch("/brain/listen", { method: "POST", body: form });
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                recording = true;
                micBtn.textContent = "stop";
                micBtn.classList.add("recording");
            }
        }

        // --- Auto-listen (continuous with 3s silence threshold) ---
        const autoBtn = document.getElementById("auto-btn");
        let autoListening = false;
        let autoStream = null;
        let audioContext = null;
        let analyser = null;
        let silenceStart = null;
        const SILENCE_THRESHOLD = 0.01;
        const SILENCE_DURATION = 3000; // 3 seconds

        async function toggleAutoListen() {
            if (autoListening) {
                stopAutoListen();
            } else {
                startAutoListen();
            }
        }

        async function startAutoListen() {
            autoStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioContext = new AudioContext();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            const source = audioContext.createMediaStreamSource(autoStream);
            source.connect(analyser);

            autoListening = true;
            autoBtn.textContent = "stop";
            autoBtn.classList.add("recording");

            startAutoRecording();
        }

        function stopAutoListen() {
            autoListening = false;
            autoBtn.textContent = "auto";
            autoBtn.classList.remove("recording");
            if (autoStream) autoStream.getTracks().forEach(t => t.stop());
            if (audioContext) audioContext.close();
        }

        function getRMS() {
            const data = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(data);
            let sum = 0;
            for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
            return Math.sqrt(sum / data.length);
        }

        function startAutoRecording() {
            if (!autoListening) return;

            const rec = new MediaRecorder(autoStream);
            const chunks = [];
            let speaking = false;
            silenceStart = null;

            rec.ondataavailable = (e) => chunks.push(e.data);
            rec.onstop = async () => {
                if (speaking && chunks.length > 0) {
                    const blob = new Blob(chunks, { type: "audio/wav" });
                    const form = new FormData();
                    form.append("audio", blob, "recording.wav");
                    addMessage({ type: "status", text: "transcribing..." });
                    await fetch("/brain/listen", { method: "POST", body: form });
                }
                if (autoListening) startAutoRecording();
            };

            rec.start();

            const check = setInterval(() => {
                if (!autoListening) {
                    clearInterval(check);
                    rec.stop();
                    return;
                }
                const rms = getRMS();
                if (rms > SILENCE_THRESHOLD) {
                    speaking = true;
                    silenceStart = null;
                } else if (speaking && !silenceStart) {
                    silenceStart = Date.now();
                } else if (speaking && silenceStart && Date.now() - silenceStart > SILENCE_DURATION) {
                    clearInterval(check);
                    rec.stop();
                }
            }, 100);
        }
    </script>
</body>
</html>
